name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  BIN: Impulse-server

jobs:
  # Native builds on each runner (fast, no emulation).
  native:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: impulse-server-linux-x64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: impulse-server-macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: impulse-server-windows-x64.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/${{ env.BIN }}${{ endsWith(matrix.artifact, '.exe') && '.exe' || '' }}
          if-no-files-found: error

  # Cross-compiled ARM64 binaries via `cargo-zigbuild` (works for
  # Linux/macOS/Windows ARM64 from a single Linux runner).
  cross:
    name: Cross build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            artifact: impulse-server-linux-arm64
          - target: aarch64-apple-darwin
            artifact: impulse-server-macos-arm64
          - target: aarch64-pc-windows-gnu
            artifact: impulse-server-windows-arm64.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Cross build release
        run: cargo zigbuild --target ${{ matrix.target }} --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/${{ env.BIN }}${{ endsWith(matrix.artifact, '.exe') && '.exe' || '' }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [native, cross]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
