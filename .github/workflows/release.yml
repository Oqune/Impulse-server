name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN: impulse-server

jobs:
  release:
    name: Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: impulse-server-linux-x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: impulse-server-linux-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: impulse-server-macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: impulse-server-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: impulse-server-windows-x64.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux cross-targets)
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.target == 'aarch64-unknown-linux-gnu' }}
        run: cargo install cross --locked

      - name: Build (native)
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.target == 'aarch64-unknown-linux-gnu') }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.target == 'aarch64-unknown-linux-gnu' }}
        run: cross build --release --target ${{ matrix.target }}

      - name: Prepare artifact (Unix)
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          cp target/${{ matrix.target }}/release/${{ env.BIN }} ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}

      - name: Prepare artifact (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        run: cp target/${{ matrix.target }}/release/${{ env.BIN }}.exe ${{ matrix.artifact }}

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
