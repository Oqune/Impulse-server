name: Server Build & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            family: linux
            arch: amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            family: linux
            arch: arm64
            cross: "aarch64-linux-gnu-gcc"
            apt: "gcc-aarch64-linux-gnu g++-aarch64-linux-gnu"
          - target: armv7-unknown-linux-gnueabihf
            os: ubuntu-latest
            family: linux
            arch: armv7
            cross: "arm-linux-gnueabihf-gcc"
            apt: "gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf"
          - target: riscv64gc-unknown-linux-gnu
            os: ubuntu-latest
            family: linux
            arch: riscv64
            cross: "riscv64-linux-gnu-gcc"
            apt: "gcc-riscv64-linux-gnu g++-riscv64-linux-gnu"
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            family: windows
            arch: amd64
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            family: windows
            arch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux)
        if: matrix.cross != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}
          LINKER_ENV="CARGO_TARGET_$(echo ${{ matrix.target }} | tr '[:lower:]-' '[:upper:]_')_LINKER"
          echo "$LINKER_ENV=${{ matrix.cross }}" >> $GITHUB_ENV

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Linux tar.gz)
        if: matrix.family == 'linux'
        shell: bash
        run: |
          set -e
          mkdir -p pkg/ImpulseServer-${{ matrix.arch }}
          cp target/${{ matrix.target }}/release/impulse-server pkg/ImpulseServer-${{ matrix.arch }}/impulse-server
          cp LICENSE pkg/ImpulseServer-${{ matrix.arch }}/
          cp config.toml.example pkg/ImpulseServer-${{ matrix.arch }}/
          tar -C pkg -czf ImpulseServer-linux-${{ matrix.arch }}.tar.gz ImpulseServer-${{ matrix.arch }}

      - name: Package (Windows zip)
        if: matrix.family == 'windows'
        shell: pwsh
        run: |
          $dir = "pkg/ImpulseServer-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/impulse-server.exe" "$dir/impulse-server.exe"
          Copy-Item "LICENSE" "$dir/"
          Copy-Item "config.toml.example" "$dir/"
          Compress-Archive -Path "$dir" -DestinationPath "ImpulseServer-windows-${{ matrix.arch }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImpulseServer-${{ matrix.family }}-${{ matrix.arch }}
          path: ImpulseServer-${{ matrix.family }}-${{ matrix.arch }}.*
          retention-days: 14

  package:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu

      - name: Install cross tools (arm64)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Install package tools
        run: |
          cargo install cargo-deb --locked
          cargo install cargo-generate-rpm --locked

      - name: Build deb (amd64)
        run: cargo deb --target x86_64-unknown-linux-gnu

      - name: Build deb (arm64)
        run: cargo deb --target aarch64-unknown-linux-gnu

      - name: Build rpm (amd64)
        run: cargo generate-rpm --target x86_64-unknown-linux-gnu

      - name: Build rpm (arm64)
        run: cargo generate-rpm --target aarch64-unknown-linux-gnu

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            target/debian/*.deb
            target/*/debian/*.deb
            target/*/generate-rpm/*.rpm
          retention-days: 14

  release:
    needs: [ build, package ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
