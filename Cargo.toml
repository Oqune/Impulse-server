[package]
name = "impulse-server"
version = "1.0.0"
edition = "2024"
description = "Secure WebSocket (WSS) chat server with bcrypt authentication"
license = "MIT"
authors = ["oqune"]
repository = "https://github.com/oqune/impulse-server"
readme = "README.md"
keywords = ["websocket", "wss", "chat", "tls", "rust"]
categories = ["network-programming"]

[lib]
name = "impulse_server"
path = "src/lib.rs"

[[bin]]
name = "Impulse-server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = { version = "0.28.0", features = ["tokio-rustls"] }
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2.2"
rcgen = "0.13"
if-addrs = "0.13"
futures-util = "0.3.0"
bcrypt = "0.15.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
