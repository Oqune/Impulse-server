[package]
name = "impulse-server"
version = "2.7.4"
edition = "2024"
description = "Secure ephemeral messenger server over WebTransport (QUIC) with TOFU trust-on-first-use"
license = "MIT"
authors = ["oqune"]
repository = "https://github.com/oqune/impulse-server"
readme = "README.md"
keywords = ["webtransport", "quic", "messenger", "tofu", "rust"]
categories = ["network-programming"]

[lib]
name = "impulse_server"
path = "src/lib.rs"

[[bin]]
name = "impulse-server"
path = "src/main.rs"

[dependencies]
# WebTransport (QUIC/HTTP3) transport
wtransport = { version = "0.7", features = ["quinn"] }

# TLS / certificate generation
# aws-lc-rs enables hybrid PQ X25519Kyber768 key exchange for TLS 1.3.
# The `pq` feature on aws-lc-rs must be explicit so cargo unifies it transitively.
rustls = { version = "0.23", features = ["aws-lc-rs"] }
rustls-pki-types = "1.10"
rcgen = "0.14"
sha2 = "0.10"
rand = "0.8"
time = "0.3"

# Async runtime
tokio = { version = "1", features = ["full"] }

# TUI
ratatui = "0.30"
crossterm = "0.29"
tui-qrcode = "0.2"
qrcode = { version = "0.14", default-features = false }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Clipboard support for log copy
copypasta = "0.10"

# Concurrency-friendly collections
dashmap = "6"
crossbeam-channel = "0.5"

# Error handling
anyhow = "1"

# X.509 certificate parsing (validity period, issuer, etc.)
x509-parser = { version = "0.17", default-features = false }

# Hex encoding
hex = "0.4"

# HMAC-SHA-256 for challenge-response auth
hmac = "0.12"

# Argon2id for password hashing (--hash-password CLI)
argon2 = "0.5"

# Hidden password input for --init / first-run wizard
rpassword = "7"

# CLI + config
clap = { version = "4", features = ["derive"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[package.metadata.deb]
name = "impulse-server"
maintainer = "oqune"
copyright = "2026, oqune"
section = "net"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/impulse-server", "usr/bin/", "755"],
    ["packaging/config.toml", "etc/impulse-server/config.toml", "644"],
    ["packaging/impulse-server.service", "lib/systemd/system/", "644"],
]

[package.metadata.generate-rpm]
name = "impulse-server"
license = "MIT"
summary = "Secure ephemeral messenger server over WebTransport"
description = "Impulse Server - secure ephemeral messenger server over WebTransport (QUIC) with TOFU trust-on-first-use"
version = "2.7.4"
assets = [
    { source = "target/release/impulse-server", dest = "/usr/bin/impulse-server", mode = "755" },
    { source = "packaging/config.toml", dest = "/etc/impulse-server/config.toml", mode = "644" },
    { source = "packaging/impulse-server.service", dest = "/usr/lib/systemd/system/", mode = "644" },
]
