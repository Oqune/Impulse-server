[package]
name = "impulse-server"
version = "0.1.0"
edition = "2024"

[lib]
name = "impulse_server"
path = "src/lib.rs"

[[bin]]
name = "Impulse-server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = "0.28.0"
futures-util = "0.3.0"
bcrypt = "0.15.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
